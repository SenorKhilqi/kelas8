<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LKPD AR — AR Mode</title>
  <meta name="description" content="LKPD Interaktif berbasis WebAR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="ar-active">

  <!-- AR CONTAINER -->
  <div id="ar-container" style="display:block; position:fixed; inset:0; z-index:1;"></div>

  <!-- UI PANEL -->
  <div id="ui-panel" style="display:flex" class="ui-panel">

    <!-- Top Bar -->
    <div class="top-bar glass">
      <div class="shape-switch">
        <button class="shape-btn active" id="sbtn-prisma" onclick="App.switchShape('prisma')"><!-- 🔷 --> Prisma</button>
        <button class="shape-btn" id="sbtn-limas" onclick="App.switchShape('limas')"><!-- 🔺 --> Limas</button>
      </div>
      <span class="mode-badge" id="mode-badge">AR</span>
    </div>

    <!-- Scene Tabs -->
    <div class="scene-tabs glass">
      <button class="tab active" id="tab-1" onclick="App.switchScene(1)">
        <span class="tab-icon"><!-- 🔍 --></span>
        <span>Unsur-unsur</span>
      </button>
      <button class="tab" id="tab-2" onclick="App.switchScene(2)">
        <span class="tab-icon"><!-- ↔️ --></span>
        <span>Orientasi</span>
      </button>
      <button class="tab" id="tab-3" onclick="App.switchScene(3)">
        <span class="tab-icon"><!-- 📐 --></span>
        <span>Jaring-jaring</span>
      </button>
    </div>

    <!-- ── Panel 1: Unsur-unsur ── -->
    <div id="panel-1" class="scene-panel glass">
      <div class="panel-header">
      </div>
      <div class="elem-grid">
        <button class="elem-btn" id="ebtn-alas" onclick="App.highlightEl('alas')">
          <span class="elem-icon"><!-- ⬡ --></span>
          <span id="lbl-alas">Alas &amp; Tutup</span>
        </button>
        <button class="elem-btn" id="ebtn-tinggi" onclick="App.highlightEl('tinggi')">
          <span class="elem-icon"><!-- 📏 --></span>
          <span>Tinggi (t)</span>
        </button>
        <button class="elem-btn" id="ebtn-rusuk" onclick="App.highlightEl('rusuk')">
          <span class="elem-icon"><!-- ⬚ --></span>
          <span>Rusuk</span>
        </button>
        <button class="elem-btn" id="ebtn-titik" onclick="App.highlightEl('titik')">
          <span class="elem-icon"><!-- ● --></span>
          <span>Titik Sudut</span>
        </button>
      </div>
      <button class="btn-reset" onclick="App.resetHighlight()"><!-- 🔄 --> Reset Tampilan</button>
    </div>

    <!-- ── Panel 2: Orientasi ── -->
    <div id="panel-2" class="scene-panel glass" style="display:none">
      <div class="panel-header">
        <h3>Orientasi Bangun Ruang</h3>
        <p>Seret/swipe untuk memutar model 360°</p>
      </div>
      <div class="orient-center">
        <button class="orient-btn" id="orient-btn" onclick="App.toggleOrient()">
          <span class="orient-icon" id="orient-icon"><!-- ↩️ --></span>
          <span id="orient-lbl">Rebahkan</span>
        </button>
      </div>
      <div class="hints">
        <div class="hint"><!-- 👆 --> Seret layar untuk memutar 360°</div>
        <div class="hint"><!-- 🔄 --> Tombol untuk rebahkan / tegakkan</div>
      </div>
    </div>

    <!-- ── Panel 3: Jaring-jaring ── -->
    <div id="panel-3" class="scene-panel glass" style="display:none">
      <div class="panel-header">
        <h3>Jaring-jaring Bangun Ruang</h3>
        <p>Geser slider untuk membuka/menutup jaring</p>
      </div>
      <div class="slider-section">
        <div class="slider-labels">
          <span><!-- 📄 --> Jaring 2D</span>
          <span class="slider-pct" id="slider-pct">100%</span>
          <span><!-- 🧊 --> Bangun 3D</span>
        </div>
        <input type="range" id="net-slider" class="net-slider" min="0" max="100" value="100"
          oninput="App.updateNet(this.value)">
        <div class="slider-state" id="slider-state">Bangun 3D penuh</div>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <button class="btn-back" onclick="App.goBack()">← Kembali</button>
      <span class="app-credit">LKPD AR · Kelas VIII SMP</span>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.startAR();
    });
  </script>
</body>
</html>

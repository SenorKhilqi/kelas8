<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LKPD AR — Bangun Ruang Sisi Datar | Kelas VIII SMP</title>
  <meta name="description"
    content="LKPD Interaktif berbasis WebAR untuk Prisma Segitiga dan Limas Segiempat — Matematika Kelas VIII SMP">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ════════════════════════════════════════
     INTRO OVERLAY
════════════════════════════════════════ -->
  <div id="overlay-intro" class="overlay active">
    <div class="overlay-bg"></div>

    <div class="intro-card glass">

      <!-- Header -->
      <div class="intro-header">
        <div class="intro-logo"><!-- 📐 --></div>
        <div class="intro-brand">
          <span class="brand-tag">LKPD Interaktif WebAR</span>
          <h1>Bangun Ruang</h1>
          <h2>Irdina Afza Wafiqoh</h2>
        </div>
      </div>

      <!-- Subtitle -->
      <div class="intro-body">
        <h2>Prisma Segitiga &amp; Limas Segiempat</h2>
        <div class="grade-pill">📚 Matematika · Kelas VIII SMP</div>
      </div>

      <!-- Feature Tags -->
      <div class="intro-features">
        <div class="feat"><!-- 🔍 --> <span>Unsur-unsur</span></div>
        <div class="feat"><!-- ↔️ --> <span>Orientasi</span></div>
        <div class="feat"><!-- 📐 --> <span>Jaring-jaring</span></div>
      </div>

      <!-- CTA Buttons -->
      <div class="intro-actions">
        <button class="btn-primary" id="btn-start-ar" onclick="window.location.href='ar.html'">
          <span class="btn-icon"><!-- 📷 --></span>
          <span class="btn-texts">
            <span class="btn-title">Mulai dengan AR</span>
            <span class="btn-sub">Butuh marker Hiro + kamera</span>
          </span>
        </button>
        <button class="btn-secondary" id="btn-start-demo" onclick="window.location.href='demo.html'">
          <span class="btn-icon"><!-- 🖥️ --></span>
          <span class="btn-texts">
            <span class="btn-title">Mode Demo</span>
            <span class="btn-sub">Tanpa kamera, langsung jelajahi</span>
          </span>
        </button>
      </div>

      <button class="btn-link" onclick="App.showMarker()"><!-- 📋 --> Tampilkan Marker Hiro</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════
     MARKER MODAL
════════════════════════════════════════ -->
  <div id="modal-marker" class="modal-backdrop" onclick="App.hideMarker()">
    <div class="modal-card glass" onclick="event.stopPropagation()">
      <div class="modal-top">
        <h3>Marker Hiro</h3>
        <button class="modal-close" onclick="App.hideMarker()">✕</button>
      </div>
      <p>Cetak atau tampilkan gambar ini, lalu arahkan kamera ke marker.</p>
      <div class="marker-wrap">
        <img id="hiro-img" src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png"
          alt="Hiro AR Marker" class="marker-img"
          onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect width=%22200%22 height=%22200%22 fill=%22%23fff%22/><rect x=%2210%22 y=%2210%22 width=%22180%22 height=%22180%22 fill=%22%23000%22/><rect x=%2225%22 y=%2225%22 width=%22150%22 height=%22150%22 fill=%22%23fff%22/><rect x=%2240%22 y=%2240%22 width=%22120%22 height=%22120%22 fill=%22%23000%22/><rect x=%2260%22 y=%2260%22 width=%2280%22 height=%2280%22 fill=%22%23fff%22/><rect x=%2278%22 y=%2278%22 width=%2244%22 height=%2244%22 fill=%22%23000%22/></svg>'">
      </div>
      <p class="marker-tip"><!-- 💡 --> Ideal: cetak 8 × 8 cm atau lebih besar</p>
      <button class="btn-secondary sm" onclick="App.hideMarker()">Tutup</button>
    </div>
  </div>

  <!-- Containers removed, now in ar.html and demo.html -->

  <script src="app.js"></script>
</body>

</html>
